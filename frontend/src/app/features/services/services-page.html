<section class="k9-page">
  <div class="k9-wrap">
    <header class="k9-section-head">
      <p class="k9-eyebrow">Latacunga</p>
      <h1>Servicios</h1>
      <p>
        Guardería canina, hospedaje, baños, adiestramiento y productos de entrenamiento con retiro en
        el local. Los precios son de ejemplo.
      </p>
    </header>
    <div class="k9-cards">
      @for (service of site.services; track service.slug) {
        <app-service-card [service]="service" />
      }
    </div>
  </div>
</section>
